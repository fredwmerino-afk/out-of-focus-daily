<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Out of Focus Daily</title>
<meta name="description" content="Contact Out of Focus Daily with questions, corrections or painting suggestions.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body>
<div class="page">
  <div class="top"><a class="logo" href="index.html">Out of <b>Focus</b></a><a class="play" href="index.html">Play today’s puzzle</a></div>

  <h1>Contact</h1>
  <p class="lede">Questions, corrections, ideas for paintings to add, or just a hello: we’d love to hear from you.</p>

  <form name="contact" method="POST" action="thanks.html" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="contact">
    <p class="hidden"><label>Leave this empty: <input name="bot-field"></label></p>
    <label>Your name (optional)<input type="text" name="name" autocomplete="name"></label>
    <label>Your email (optional, if you’d like a reply)<input type="email" name="email" autocomplete="email"></label>
    <label>Topic
      <select name="topic">
        <option>General question</option>
        <option>A mistake in a painting’s title, date or facts</option>
        <option>Suggest a painting</option>
        <option>Something isn’t working</option>
        <option>Other</option>
      </select>
    </label>
    <label>Message<textarea name="message" required></textarea></label>
    <button type="submit">Send message</button>
  </form>
  <p class="note">We use what you send only to read and reply to your message. See our <a href="privacy.html">Privacy Policy</a>.</p>

  <footer><a href="index.html">Play</a><a href="how-to-play.html">How to play</a><a href="about.html">About</a><a href="privacy.html">Privacy</a><a href="contact.html">Contact</a></footer>
</div>
</body>
</html>
